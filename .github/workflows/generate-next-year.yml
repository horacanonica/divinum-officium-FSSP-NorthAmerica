name: Generate Next Year EPUBs

on:
  schedule:
    - cron: '0 6 1 11 *'   # November 1 at 06:00 UTC
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to generate (leave blank for next calendar year)'
        required: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flyctl
        run: curl -L https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Generate EPUBs
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly-epub.toml)
          YEAR="${{ github.event.inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR=$(date -d '+1 year' +%Y)
          fi
          echo "Generating EPUBs for year $YEAR in app: $APP"
          flyctl ssh console --app "$APP" -C "python3 /app/gen_all.py --year $YEAR"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_EPUB }}
        timeout-minutes: 60
