name: Deploy to Fly.io

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      regenerate:
        description: 'Regenerate EPUBs after deploy'
        type: boolean
        default: true

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy web app
        run: fly deploy --config fly-web.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}

  deploy-epub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy epub app
        run: fly deploy --config fly-epub.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_EPUB }}
      - name: Regenerate EPUBs for current year
        if: github.event_name == 'push' || github.event.inputs.regenerate == 'true'
        run: |
          APP=$(sed -n 's/^app = "\(.*\)"/\1/p' fly-epub.toml)
          YEAR=$(date +%Y)
          echo "Regenerating EPUBs for $YEAR in app: $APP"
          fly ssh console --app "$APP" -C "python3 /app/gen_all.py --year $YEAR"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_EPUB }}
        timeout-minutes: 60
