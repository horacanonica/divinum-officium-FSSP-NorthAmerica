# Fly.io config — EPUB generator (public downloads, admin-gated generation)
#
# One-time setup (run on hal9000):
#   fly apps create <your-chosen-name>
#   fly volumes create epub_output --app <your-chosen-name> --region iad --size 3
#   fly secrets set ADMIN_USER=yourname ADMIN_PASS=strongpassword \
#       --app <your-chosen-name>
#   fly tokens create deploy -x 999999h --app <your-chosen-name>
#     → save token as GitHub secret FLY_API_TOKEN_EPUB
#   fly deploy --config fly-epub.toml --remote-only

app = "divinum-officium-epub"   # ← change to your chosen name
primary_region = "iad"

[build]
  dockerfile = "epubweb/Dockerfile"

[env]
  PORT = "8090"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "epub_output"
  destination = "/epub-output"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
