# Fly.io config — Divinum Officium FSSP web viewer (public)
#
# One-time setup (run on hal9000):
#   fly apps create <your-chosen-name>
#   fly volumes create ordo_cache --app <your-chosen-name> --region iad --size 1
#   fly tokens create deploy -x 999999h --app <your-chosen-name>
#     → save token as GitHub secret FLY_API_TOKEN_WEB
#   fly deploy --config fly-web.toml --remote-only

app = "divinum-officium-fssp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "ordo_cache"
  destination = "/var/www/web/ordo-cache"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
