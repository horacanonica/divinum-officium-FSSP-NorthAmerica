{% extends "base.html" %}
{% block title %}Create Password — Divinum Officium{% endblock %}
{% block content %}
<div class="subtitle">Create Password</div>
<p class="section-desc" style="text-align:center;margin-bottom:1rem;">
  Your email is listed in the Ordo Administratus.<br>
  Choose a password to complete your registration.
</p>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form method="post" action="/auth/signup/ordo">
  <input type="hidden" name="email" value="{{ email }}">

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autofocus autocomplete="new-password" minlength="8">

  <label for="confirm_password">Confirm Password</label>
  <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" minlength="8">

  <button type="submit" class="btn">Register</button>
</form>
{% endblock %}
