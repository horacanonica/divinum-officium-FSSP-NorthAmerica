# FSSP North American Province — local calendars
# Source: FSSP 2026 Ordo (NA Province), Supplement pp. 47–54, Directory pp. 55–59.
# Dates are MM-DD. Ranks per 1960 rubrics. "as_on_feast" = already I class universally; no change.
# propers: base     -> exists in 1962 base with own texts; raise rank only (build 9 lessons if needed)
#          commons  -> not in 1962 calendar; build from commune; register in LOCAL_PROPERS_REGISTRY
#          pending  -> do not implement until confirmed/supplied
# bishop_commemorations: Mass-only "pro Episcopo" collect; no Office effect.
#
# Pasted verbatim from the task; the only edits are two YAML syntax fixes
# (brookville-ss-philomena-cecilia and ottawa-st-clement `titulars` were a block
# sequence inside a flow mapping, which does not parse — converted to flow lists).
# Anything carrying CONFIRM / pending is an open question: it is NOT generated and
# its location is hidden until answered. See docs/ai/OPEN_QUESTIONS.md.

meta:
  ordo_year: 2026
  fssp_layer_items:
    - {date: "02-22", title: "Chair of St. Peter", rank: I, note: "FSSP; 2026 transferred to 02-23"}
    - {date: "03-07", title: "St. Thomas Aquinas, Confessor & Doctor", rank: II}
    - {date: "08-01", title: "St. Peter in Chains", rank: III, note: "comm. St. Paul under one conclusion; comm. Holy Machabees"}
    - {date: "06-29", title: "Ss. Peter & Paul (FSSP titular)", rank: I, note: "External Solemnity is Mass-only"}
    - {date: "11-04", title: "St. Charles Borromeo, Principal Patron", rank: I, applies_to_kind: seminary}
  usa_only_items_2026_ordo:   # must never appear in Canadian calendars
    - {date: "01-04", title: "St. Elizabeth Ann Seton (1964)"}
    - {date: "01-05", title: "St. John Neumann (1963)"}
    - {date: "01-22", title: "Votive Mass for Peace"}
    - {date: "09-09", title: "St. Peter Claver"}
    - {date: "09-26", title: "North American Martyrs (USA form, III class, Jogues first)"}
    - {date: "11-13", title: "St. Frances Xavier Cabrini"}
    - {date: "movable", title: "External Solemnity of Corpus Christi (Sunday after)"}
  shared_can_usa_items:
    - {date: "12-12", title: "Our Lady of Guadalupe", rank: III, note: "Ordo tags CAN & USA; CDW decree 25 Mar 1999"}
  canada_known_pending:
    - {date: "09-26", title: "Canadian Martyrs (Brébeuf first)", rank: II, propers: pending}

